<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="acG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <filter id="glowF">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes latido {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 15px #A855F7b3); }
      50%      { opacity: 1;    filter: drop-shadow(0 0 30px #F59E0B); }
    }
    @keyframes giro {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .fondo  { fill: url(#bgG); }
    .titulo { font-family: 'Outfit', 'Segoe UI', sans-serif; font-weight: 900; font-size: 33px;
               fill: url(#acG); animation: latido 3.5s infinite ease-in-out; }
    .sub    { font-family: 'Inter', 'Segoe UI', sans-serif; font-weight: 700; font-size: 14px;
               fill: #94A3B8; letter-spacing: 3px; }
    .chapa  { fill: #0F172A; stroke-width: 1.5; rx: 6px; }
    .ctexto { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; }
  </style>

  <rect class="fondo" width="920" height="300" rx="14" stroke="#A855F7" stroke-width="1.5" />

  <g transform="translate(460, 95)" filter="url(#glowF)">
    <!-- El giro va en SMIL y no en CSS a proposito: GitHub sirve el banner dentro de un <img>,
         y ahi `transform-box: fill-box` no se aplica igual en todos los navegadores, con lo que
         la figura giraba alrededor de la esquina del SVG en vez de sobre si misma. -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="24s" repeatCount="indefinite"/>
    <g>
      <path d="M 0 -46 L 32 0 L 0 46 L -32 0 Z" fill="none" stroke="url(#acG)" stroke-width="3.5"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/>
    </g>
    <path d="M 0 -30 L 21 0 L 0 30 L -21 0 Z" fill="#A855F7" opacity="0.18"/>
    <path d="M -9 -14 L -9 6 M 9 -14 L 9 6 M -9 6 L 0 20 L 9 6" fill="none" stroke="#F59E0B"
          stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="-20" r="4.5" fill="#F59E0B">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    </g>
  </g>

  <text x="460" y="185" text-anchor="middle" class="titulo">MULTIVERSECREATURES</text>
  <text x="460" y="215" text-anchor="middle" class="sub">CRIATURAS, JEFES Y OBJETOS DE OTROS UNIVERSOS</text>

  <g transform="translate(240, 245)">
    <rect x="0" y="0" width="145" height="30" class="chapa" stroke="#A855F7" />
    <text x="12" y="20" class="ctexto" fill="#A855F7">DRAKES LABS</text>

    <rect x="165" y="0" width="135" height="30" class="chapa" stroke="#38BDF8" />
    <text x="177" y="20" class="ctexto" fill="#38BDF8">PAPER 1.21.11</text>

    <rect x="320" y="0" width="120" height="30" class="chapa" stroke="#A3E635" />
    <text x="332" y="20" class="ctexto" fill="#A3E635">JAVA 21</text>
  </g>
</svg>
