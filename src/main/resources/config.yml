# MultiverseCreatures Configuration

### General Settings
general:
  debug: false
  locale: "en"
  # Global multiplier applied to every entity spawn-chance (0.5 = half the spawns)
  spawn-rate-multiplier: 0.5

### Crafting Recipes
recipes:
  enabled: true
  # Registers recipes a few ticks after startup instead of during plugin enable.
  # Required on servers with EquivalencyTech (EMC): it indexes every registered
  # recipe at enable and our custom items share material types with vanilla
  # ingredients, causing an exponential EMC graph walk that hangs startup.
  deferred-registration: true

### Wandering Trader (Multiverse Merchant)
merchant:
  enabled: true
  spawn-chance: 0.3
  custom-name: "&6Multiverse Merchant"
  name-visible: true
  trades:
    scooby-cookies:
      enabled: true
      price:
        material: "DIAMOND"
        amount: 20
      result-amount: 5
      max-uses: 999
    excalibur:
      enabled: true
      price:
        - material: "NETHER_STAR"
          amount: 16
          custom-item: "starcore"
        - material: "NETHERITE_INGOT"
          amount: 32
      max-uses: 1
    ice-crown:
      enabled: true
      price:
        - material: "NETHER_STAR"
          amount: 48
        - material: "BLUE_ICE"
          amount: 64
      max-uses: 1
    wirts-lantern:
      enabled: true
      price:
        - material: "SOUL_SAND"
          amount: 32
        - material: "SOUL_SOIL"
          amount: 16
      max-uses: 1

