      snow-effects:
        slowness:
          duration-ticks: 100
          amplifier: 2
        weakness:
          duration-ticks: 100
          amplifier: 1
      ice-effects:
        slowness:
          duration-ticks: 100
          amplifier: 2
        weakness:
          duration-ticks: 100
          amplifier: 2
        nausea:
          duration-ticks: 100
          amplifier: 0
      impact-radius: 2
      freeze-water-chance: 1.0
      place-snow-chance: 0.2
      knockback:
        horizontal: 0.8
        vertical: 0.3
    blizzard:
      enabled: true
      cooldown-ms: 60000
      duration-ticks: 100
      starting-radius: 1.0
      max-radius: 8.0
      radius-growth-per-tick: 0.07
      damage-per-tick: 3.5
      slowness:
        duration-ticks: 40
        amplifier: 2
