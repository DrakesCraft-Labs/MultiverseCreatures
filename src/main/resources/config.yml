    slowness:
      duration-ticks: 40
      amplifier: 2
    darkness:
      duration-ticks: 40
      amplifier: 2
    push-strength: 0.50
    freeze-water: true
    place-snow-chance: 0.1
  ice-path:
    enabled: true
    frost-water: true
    frost-radius: 1
    adjacent-freeze-chance: 0.3
  damage-reduction:
    enabled: true
    multiplier: 0.8
  freeze-immunity: true

