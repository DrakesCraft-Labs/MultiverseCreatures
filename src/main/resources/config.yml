  # -------------------------------------------------------------------------
  creeper-jr:
    enabled: true
    spawn-chance: 0.15
    scale: 0.6
    speed: 0.5
    explosion-radius: 2
    true-damage: 12.0
    death-messages:
      - "&a%player% was blown up by Creeper Jr."
      - "&a%player% got too close to a Creeper Jr."
      - "&a%player% learned that size isn't everything"
      - "&a%player% underestimated the little guy"

  # -------------------------------------------------------------------------
  # Bone Shield
  # -------------------------------------------------------------------------
  bone-shield:
    enabled: true
    spawn-chance: 0.06
    health: 120.0
    drop-chance: 0.8
    shield-equip-chance: 0.05
    death-messages:
      - "&7%player% broke their bones against the Bone Shield"
      - "&7%player% was boned by the Bone Shield"
      - "&7%player% shattered against the bone wall"

  # -------------------------------------------------------------------------
  # Chaos Mage
  # -------------------------------------------------------------------------
  chaos-mage:
    enabled: true
    spawn-chance: 0.4
    raid-spawn-chance: 0.5
    health: 70.0
    drop-chance: 0.6
    death-messages:
      - "&5%player% was consumed by chaos magic"
      - "&5%player% could not escape the Chaos Mage's spells"
      - "&5%player% was turned to dust by a Chaos Mage"

  # -------------------------------------------------------------------------
  # Ender Knight
  # -------------------------------------------------------------------------
  ender-knight:
    enabled: true
